plugins {
    id 'fabric-loom' version '1.6.12'
}

group = maven_group
version = mod_version
def familyCompatibilityGeneration = providers
        .gradleProperty('family_compatibility_generation')
        .map { it.toInteger() }
        .get()
if (familyCompatibilityGeneration < 1) {
    throw new GradleException('family_compatibility_generation must be positive')
}
base { archivesName = "${archives_base_name}-compat${familyCompatibilityGeneration}" }

def textureDedupeEnabled = providers.gradleProperty('textureDedupe')
        .map { it.toBoolean() }
        .getOrElse(true)
def daedalonClientDirectory = providers.gradleProperty('daedalonClientDirectory')
        .getOrElse('run-dev')
def textureDedupePython = providers.gradleProperty('textureDedupePython')
        .getOrElse('python')
def textureDedupeTool = file('tools/texture_dedupe.py')
def textureDedupeTest = file('tools/test_texture_dedupe.py')
def textureDedupeInventoryConfig = file('config/texture-dedupe-native.json')
def textureDedupeSourceId = 'daedalon-native-mc1.20.1'
def textureDedupeReportDirectory =
        layout.buildDirectory.dir('reports/texture-dedupe')
def textureDedupeInventoryJson =
        textureDedupeReportDirectory.map { it.file('inventory.json') }
def textureDedupeInventoryCsv =
        textureDedupeReportDirectory.map { it.file('inventory.csv') }
def textureDedupePlan =
        textureDedupeReportDirectory.map { it.file('plan.json') }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

// Keep Minecraft 1.20.1's LWJGL version when optional Sodium/Iris are present.
configurations.configureEach {
    resolutionStrategy.eachDependency { dependency ->
        if (dependency.requested.group == 'org.lwjgl') {
            dependency.useVersion '3.3.1'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // Optional settings entry point; Mod Menu is never bundled or required.
    modCompileOnly "com.terraformersmc:modmenu:7.2.2"
    modRuntimeOnly "com.terraformersmc:modmenu:7.2.2"

    // Optional rendering integrations used by the migrated OBJ renderer.
    modCompileOnly "maven.modrinth:sodium:mc1.20.1-0.5.13-fabric"
    modCompileOnly "maven.modrinth:indium:1.0.36+mc1.20.1"
    modCompileOnly "maven.modrinth:iris:1.7.6+1.20.1"
    modRuntimeOnly "maven.modrinth:sodium:mc1.20.1-0.5.13-fabric"
    modRuntimeOnly "maven.modrinth:indium:1.0.36+mc1.20.1"
    modRuntimeOnly "maven.modrinth:iris:1.7.6+1.20.1"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"

    // Optional item browsers: compile their search aliases without bundling them.
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:12.1.785"
    modCompileOnly("mezz.jei:jei-1.20.1-fabric:15.16.2.73") {
        transitive = false
    }
    modCompileOnly "dev.emi:emi-fabric:1.1.22+1.20.1:api"

    // Iris runtime parser dependencies.
    runtimeOnly "org.anarres:jcpp:1.4.14"
    runtimeOnly "org.antlr:antlr4-runtime:4.13.1"
    runtimeOnly "io.github.douira:glsl-transformer:2.0.1"
}

// A separate development-only mod exercises the real server/mixin lifecycle.
// It is not part of the production JAR or the player's client run.
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

loom {
    mods {
        daedalon { sourceSet sourceSets.main }
        daedalon_gametest { sourceSet sourceSets.gameTest }
    }
    runs {
        client {
            programArgs '--gameDir', file(daedalonClientDirectory).absolutePath
            if (providers.gradleProperty('daedalonLanternFlameChecks').map { it.toBoolean() }.getOrElse(false)) {
                vmArg '-Ddaedalon.debug.lanternFlameChecks=true'
            }
            if (providers.gradleProperty('daedalonFinialChecks').map { it.toBoolean() }.getOrElse(false)) {
                vmArg '-Ddaedalon.debug.finialChecks=true'
            }
            if (providers.gradleProperty('daedalonGlauxChecks').map { it.toBoolean() }.getOrElse(false)) {
                vmArg '-Ddaedalon.debug.glauxChecks=true'
            }
        }
        gameTest {
            server()
            name 'Fountain regression tests'
            source sourceSets.gameTest
            vmArg '-Dfabric-api.gametest'
            def testReport = providers.gradleProperty('daedalonGlauxGameTests').map { it.toBoolean() }.getOrElse(false) ? 'glaux.xml' : 'fountains.xml'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('reports/gametest/' + testReport).get().asFile}"
            runDir 'build/gametest'
        }
    }
}

// Fabric API for 1.20.1 has no runtime test-name filter. Select only the owl
// holder in this development-only metadata when its focused suite is requested.
tasks.named('processGameTestResources', ProcessResources) {
    def glauxOnly = providers.gradleProperty('daedalonGlauxGameTests').map { it.toBoolean() }.getOrElse(false)
    inputs.property('glauxOnly', glauxOnly)
    doLast {
        if (!glauxOnly) return
        def metadataFile = new File(destinationDir, 'fabric.mod.json')
        def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
        metadata.entrypoints['fabric-gametest'] = ['com.oliver.daedalon.gametest.GlauxGameTests']
        metadataFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)) + '\n', 'UTF-8')
    }
}

tasks.named('runClient') {
    doFirst {
        def clientDirectory = file(daedalonClientDirectory)
        if (!clientDirectory.isDirectory() && !clientDirectory.mkdirs()) {
            throw new GradleException("Cannot create client directory: ${clientDirectory}")
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.register('verifyCollectionPackProfiles', JavaExec) {
    group = 'verification'
    description = 'Checks real Collection pack profiles, cached marker diagnostics and asset gating without opening Minecraft.'
    dependsOn tasks.named('testClasses')
    def probeRoot = layout.buildDirectory.dir('collection-pack-profiles')
    def probeMod = probeRoot.map { it.dir('probe-mod') }
    classpath = sourceSets.test.runtimeClasspath + files(probeMod)
    mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    maxHeapSize = '1G'
    systemProperty 'fabric.development', 'true'
    systemProperty 'fabric.remapClasspathFile', file('.gradle/loom-cache/remapClasspath.txt').absolutePath
    systemProperty 'fabric.log.disableAnsi', 'true'
    doFirst {
        def root = probeRoot.get().asFile
        root.mkdirs()
        workingDir = root
        def metadata = probeMod.get().file('fabric.mod.json').asFile
        metadata.parentFile.mkdirs()
        metadata.text = groovy.json.JsonOutput.toJson([
                schemaVersion: 1, id: 'daedalon_collection_pack_profile_probe', version: '1.0.0', environment: 'client',
                entrypoints: [preLaunch: ['com.oliver.daedalon.client.texturealias.CollectionPackProfileLaunchProbe']]
        ])
    }
}
tasks.named('check') { dependsOn tasks.named('verifyCollectionPackProfiles') }

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    inputs.property('version', project.version)
    inputs.property('familyCompatibilityGeneration', familyCompatibilityGeneration)
    inputs.property('textureDedupeEnabled', textureDedupeEnabled)
    if (textureDedupeEnabled) {
        dependsOn 'prepareTextureDedupePlan'
        inputs.file(textureDedupeTool)
        inputs.file(textureDedupePlan)
    }
    filesMatching('fabric.mod.json') {
        expand('version': project.version)
    }
    doFirst {
        project.delete(fileTree(destinationDir) {
            include 'assets/*/texture_aliases/**'
            include 'assets/*/texture_blobs/**'
        })
    }
    doLast {
        if (!textureDedupeEnabled) {
            return
        }
        def reportDirectory = textureDedupeReportDirectory.get().asFile
        reportDirectory.mkdirs()
        project.exec {
            commandLine(
                    textureDedupePython,
                    textureDedupeTool,
                    'apply',
                    '--config', textureDedupePlan.get().asFile,
                    '--stage-root', destinationDir,
                    '--report-out', new File(reportDirectory, 'apply.json')
            )
        }.assertNormalExitValue()
        project.exec {
            commandLine(
                    textureDedupePython,
                    textureDedupeTool,
                    'validate',
                    '--config', textureDedupePlan.get().asFile,
                    '--stage-root', destinationDir,
                    '--report-out', new File(reportDirectory, 'validate.json')
            )
        }.assertNormalExitValue()
    }
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

def pythonCommand = providers.environmentVariable('PYTHON')
        .orElse('python')

tasks.register('verifyDaedalonAssets', Exec) {
    group = 'verification'
    description = 'Runs Daedalon OBJ, generated-resource, texture, state, and shape safety tests.'
    workingDir projectDir
    inputs.files(
            fileTree('tools') {
                include 'generate_daedalon_assets.py'
                include 'generate_glaux_assets.py'
                include 'author_glaux_mesh.cjs'
                include 'glaux_translations.py'
                include 'daedalon_localization.py'
                include 'generate_obj_display_models.py'
                include 'author_coffered_panels.py'
                include 'coffered_panel_*.py'
                include 'generate_lantern_flame_texture.py'
                include 'prepare_lantern_mesh.py'
                include 'rebuild_gothic_lantern_tracery.py'
                include 'rebuild_plinth_meshes.py'
                include 'extend_repeat_surface_textures.py'
                include 'tests/**/*.py'
            },
            fileTree('src/main/java'),
            fileTree('src/main/resources')
    )
    inputs.file('docs/evidence/coffered-panels-source.json')
    inputs.files('config/glaux-catalogue.json', 'config/client-settings-language.json',
            'config/client-settings-style-assets.json',
            'docs/evidence/glaux-source.json', 'tools/glaux_mesh_source.json.gz')
    commandLine(
            pythonCommand.get(),
            '-m',
            'unittest',
            'discover',
            '-s',
            'tools/tests',
            '-p',
            'test_*.py',
            '-v'
    )
}

tasks.register('inventoryDaedalonTextures', Exec) {
    group = 'texture deduplication'
    description = 'Inventories Daedalon PNGs without modifying source resources.'
    inputs.files(textureDedupeTool, textureDedupeInventoryConfig)
    inputs.files(fileTree('src/main/resources') {
        include '**/*.json'
        include '**/*.png'
        include '**/*.png.mcmeta'
        include '**/*.properties'
        include '**/*.mtl'
        include '**/*.obj'
    })
    outputs.files(textureDedupeInventoryJson, textureDedupeInventoryCsv)
    doFirst {
        textureDedupeReportDirectory.get().asFile.mkdirs()
        commandLine(
                textureDedupePython,
                textureDedupeTool,
                'inventory',
                '--config', textureDedupeInventoryConfig,
                '--json-out', textureDedupeInventoryJson.get().asFile,
                '--csv-out', textureDedupeInventoryCsv.get().asFile
        )
    }
}

tasks.register('prepareTextureDedupePlan', Exec) {
    group = 'texture deduplication'
    description = 'Creates the deterministic exact-byte Daedalon alias plan.'
    dependsOn tasks.named('inventoryDaedalonTextures')
    inputs.files(textureDedupeTool, textureDedupeInventoryConfig)
    inputs.file(textureDedupeInventoryJson)
    outputs.file(textureDedupePlan)
    doFirst {
        commandLine(
                textureDedupePython,
                textureDedupeTool,
                'plan',
                '--config', textureDedupeInventoryConfig,
                '--inventory', textureDedupeInventoryJson.get().asFile,
                '--source', textureDedupeSourceId,
                '--output', textureDedupePlan.get().asFile
        )
    }
}

tasks.register('testTextureDedupeTool', Exec) {
    group = 'verification'
    description = 'Runs the vendored exact-texture deduplication tool tests.'
    inputs.files(textureDedupeTool, textureDedupeTest)
    commandLine(
            textureDedupePython,
            '-m',
            'unittest',
            'tools/test_texture_dedupe.py',
            '-v'
    )
}

tasks.register('auditDaedalonJar', Exec) {
    group = 'verification'
    description = 'Audits the final standalone Daedalon JAR and writes a JSON report.'
    dependsOn tasks.named('remapJar')
    dependsOn tasks.named('verifyDaedalonAssets')

    def remappedJar = tasks.named('remapJar').flatMap { it.archiveFile }
    inputs.file(remappedJar)
    inputs.file('tools/audit_daedalon_jar.py')
    outputs.file(layout.buildDirectory.file('reports/daedalon-jar-audit.json'))
    workingDir projectDir

    doFirst {
        commandLine(
                pythonCommand.get(),
                file('tools/audit_daedalon_jar.py').absolutePath,
                remappedJar.get().asFile.absolutePath,
                '--report',
                layout.buildDirectory.file('reports/daedalon-jar-audit.json')
                        .get().asFile.absolutePath
        )
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyDaedalonAssets')
    dependsOn tasks.named('testTextureDedupeTool')
}

tasks.named('build') {
    dependsOn tasks.named('auditDaedalonJar')
}

apply from: 'gradle/branding-validation.gradle'
